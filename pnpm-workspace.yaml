overrides:
  tmp: '>=0.2.6'
  yaml@<2.8.3: '>=2.8.3'
  # rolldown's wasm32 binding pins the 2.0 beta, and pnpm then paired that
  # runtime with core 1.x under @astrojs/check, which crashes `astro check`.
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3

allowBuilds:
  esbuild: true
  sharp: true

# Exempt from pnpm's default 24h minimumReleaseAge quarantine so daisyui bumps
# can land the same day they are published.
minimumReleaseAgeExclude:
  - daisyui
